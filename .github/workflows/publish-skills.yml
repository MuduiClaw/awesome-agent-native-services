name: Publish Skills to ClawHub

on:
  workflow_run:
    workflows: ["Validate catalog and site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish-skills:
    name: Publish validated skills
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt

      - name: Revalidate catalog and Skill packages
        run: |
          set -euo pipefail
          python3 scripts/build-machine-catalog.py --check
          python3 scripts/check-repository-health.py --local
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".skills")
          versions = json.loads((root / "versions.json").read_text(encoding="utf-8"))
          packages = sorted(path.name for path in root.iterdir() if (path / "SKILL.md").is_file())
          if sorted(versions) != packages:
              raise SystemExit(".skills/versions.json must cover every Skill package exactly")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ClawHub CLI
        run: npm install --global clawhub@0.23.3

      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLAWHUB_TOKEN" ]]; then
            echo "::error::CLAWHUB_TOKEN is not configured."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Publish immutable Skill versions
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          content_hash() {
            python3 - "$1" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_text(encoding="utf-8").rstrip("\n")
          print(hashlib.sha256(value.encode("utf-8")).hexdigest())
          PY
          }

          remote_hash() {
            local slug="$1"
            local version="$2"
            local response_file="$3"
            clawhub inspect "$slug" --version "$version" --json > "$response_file"
            python3 - "$response_file" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value = payload.get("skill", {}).get("description")
          if not isinstance(value, str) or not value:
              raise SystemExit("ClawHub readback did not include SKILL.md content")
          print(hashlib.sha256(value.rstrip("\n").encode("utf-8")).hexdigest())
          PY
          }

          publish_one() {
            local slug="$1"
            local version="$2"
            local path=".skills/$slug"
            local expected_hash
            local output_file
            local response_file
            expected_hash="$(content_hash "$path/SKILL.md")"
            output_file="$(mktemp)"
            response_file="$(mktemp)"

            set +e
            clawhub publish "$path" \
              --slug "$slug" \
              --name "$slug" \
              --version "$version" \
              --source-repo haoruilee/awesome-agent-native-services \
              --source-commit "$SOURCE_SHA" \
              --source-ref main \
              --source-path "$path" \
              --changelog "Validated catalog release $SOURCE_SHA" \
              >"$output_file" 2>&1
            publish_status=$?
            set -e
            cat "$output_file"
            if [[ "$publish_status" -ne 0 ]] &&
               ! grep -Eiq 'already exists|version.*exists|conflict' "$output_file"; then
              echo "::error::ClawHub publish failed for $slug@$version."
              exit "$publish_status"
            fi

            for _ in 1 2 3 4 5 6; do
              if actual_hash="$(remote_hash "$slug" "$version" "$response_file" 2>/dev/null)" &&
                 [[ "$actual_hash" == "$expected_hash" ]]; then
                echo "Verified $slug@$version from ClawHub."
                return 0
              fi
              sleep 5
            done
            echo "::error::ClawHub readback mismatch for $slug@$version."
            exit 1
          }

          while IFS=$'\t' read -r slug version; do
            publish_one "$slug" "$version"
          done < <(
            jq -r 'to_entries | sort_by(.key)[] | [.key, .value] | @tsv' \
              .skills/versions.json
          )
