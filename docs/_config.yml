# GitHub Pages / Jekyll — https://pages.github.com/
# Built from README via scripts/build-github-pages.sh (CI + optional local runs)

title: "The Agent-Native Index | Infrastructure for Autonomous Agents"
# Used only in <title> (short for SEO). On-page <h1> still uses page title from index.md.
seo_html_title: "The Agent-Native Index 2026 | MCP, Harnesses & AI Infrastructure"
description: "A curated 2026 collection of agent-native infrastructure: MCP tools, harnesses, identity, memory, sandboxes, browsers, payments, and runtimes."
url: "https://haoruilee.github.io"
baseurl: "/awesome-agent-native-services"
lang: en-US
author: haoruilee

# Open Graph / Twitter — used by jekyll-seo-tag
logo: "/assets/images/social-preview.png"
social:
  name: The Agent-Native Index
  links:
    - "https://github.com/haoruilee/awesome-agent-native-services"

theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# jekyll-seo-tag default image when pages do not override
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
